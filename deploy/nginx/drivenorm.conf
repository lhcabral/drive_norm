upstream drivenorm_daphne {
    server 127.0.0.1:8000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Landing page: drivenorm.com.br e www.drivenorm.com.br
server {
    listen 80;
    listen [::]:80;
    server_name drivenorm.com.br www.drivenorm.com.br;

    root /drive/landing;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|svg|webp|ico)$ {
        expires 7d;
        access_log off;
    }
}

# App (PWA) + API + WebSocket + Django admin: app.drivenorm.com.br
server {
    listen 80;
    listen [::]:80;
    server_name app.drivenorm.com.br;

    root /drive/frontend/dist;
    index index.html;

    client_max_body_size 10M;

    location /static/ {
        alias /drive/backend/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /drive/backend/media/;
        expires 7d;
        access_log off;
    }

    location ~ ^/(api|admin)/ {
        proxy_pass http://drivenorm_daphne;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /ws/ {
        proxy_pass http://drivenorm_daphne;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # O service worker e o index.html não podem ficar em cache, senão o PWA não atualiza.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
