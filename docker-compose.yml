services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: drive_norm
      POSTGRES_USER: drive_norm
      POSTGRES_PASSWORD: drive_norm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
